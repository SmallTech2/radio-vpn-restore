name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: Encryption ${{ matrix.encryption }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        encryption: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl
          if ${{ matrix.encryption }}; then sudo apt-get install -y --no-install-recommends age; fi
      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find . -name '*.sh' -not -path './.git/*' -print0)
      - name: Isolated tests
        run: |
          if ! python3 -B -m unittest discover -s tests -v > "$RUNNER_TEMP/tests.log" 2>&1; then
            cat "$RUNNER_TEMP/tests.log"
            python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text()[-6000:]; print("::error title=Isolated tests::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/tests.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/tests.log"
