# Configuration de test : directives et commentaire du modele Radio publie.
management 127.0.0.1 2080  # Interface locale OpenVPN UI

dev tun0
topology subnet
client-to-client
ccd-exclusive
server 10.3.0.0 255.255.0.0 nopool           # Trusted VPN subnet

ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/issued/server.crt
key /etc/openvpn/pki/private/server.key
crl-verify /etc/openvpn/pki/crl.pem
tls-crypt /etc/openvpn/pki/ta.key
dh /etc/openvpn/pki/dh.pem
client-config-dir /etc/openvpn/staticclients
